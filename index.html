<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillShareJR | Life City</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020510;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* =========================
   TOP HUD
========================= */

#hud {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    padding: 18px 25px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: rgba(2,5,16,0.72);

    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(80,210,255,0.18);

    z-index: 10;

}

.logo {

    font-size: 24px;

    font-weight: 900;

    letter-spacing: -1px;

}

.logo span {

    color: #28d9ff;

}

.stats {

    display: flex;

    gap: 25px;

}

.stat {

    color: #aab8d0;

}

.stat strong {

    color: #28d9ff;

}

/* =========================
   CONTROLS
========================= */

#controls {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    padding: 12px 20px;

    border-radius: 30px;

    background: rgba(2,5,16,0.8);

    border: 1px solid rgba(80,210,255,0.2);

    color: #aab8d0;

    font-size: 13px;

    z-index: 10;

}

/* =========================
   MESSAGE
========================= */

#message {

    position: fixed;

    top: 90px;

    left: 50%;

    transform: translateX(-50%);

    padding: 12px 22px;

    border-radius: 30px;

    background: rgba(10,20,50,0.92);

    border: 1px solid #28d9ff;

    color: white;

    opacity: 0;

    transition: 0.3s;

    z-index: 20;

}

/* =========================
   MODAL
========================= */

#modal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.72);

    backdrop-filter: blur(10px);

    align-items: center;

    justify-content: center;

    z-index: 100;

}

.modalBox {

    width: min(620px,90%);

    padding: 35px;

    border-radius: 25px;

    background:

        linear-gradient(

            145deg,

            #101c42,

            #050916

        );

    border: 1px solid rgba(40,217,255,0.35);

    box-shadow:

        0 0 80px rgba(40,217,255,0.18);

    text-align: center;

}

.modalBox h1 {

    font-size: 34px;

    margin-bottom: 15px;

}

.modalBox p {

    color: #aab8d0;

    line-height: 1.6;

    margin-bottom: 22px;

}

.choice {

    width: 100%;

    padding: 15px;

    margin: 7px 0;

    border-radius: 13px;

    border: 1px solid rgba(255,255,255,0.12);

    background: rgba(255,255,255,0.05);

    color: white;

    cursor: pointer;

    font-size: 15px;

    transition: 0.2s;

}

.choice:hover {

    background: rgba(40,217,255,0.12);

    border-color: #28d9ff;

    transform: translateY(-2px);

}

.close {

    margin-top: 18px;

    padding: 11px 22px;

    border: 0;

    border-radius: 10px;

    background: #1677ff;

    color: white;

    cursor: pointer;

}

</style>

</head>

<body>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="logo">

        SkillShare<span>JR</span>

    </div>

    <div class="stats">

        ⭐ XP:
        <strong id="xp">0</strong>

        &nbsp;&nbsp;

        🏆 Level:
        <strong id="level">1</strong>

    </div>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div id="message"></div>


<!-- =========================
     GAME
========================= -->

<canvas id="gameCanvas"></canvas>


<!-- =========================
     CONTROLS
========================= -->

<div id="controls">

    🎮 WASD / Arrow Keys to move
    &nbsp; • &nbsp;
    Walk near a building to enter

</div>


<!-- =========================
     CHALLENGE
========================= -->

<div id="modal">

    <div class="modalBox">

        <h1 id="modalTitle">
            Life Skill Challenge
        </h1>

        <p id="question">
            Question
        </p>

        <div id="choices"></div>

        <button
            class="close"
            onclick="closeChallenge()">

            Return to Life City

        </button>

    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   WORLD
===================================================== */

const world = {

    width: 2400,

    height: 2400

};


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x: 1200,

    y: 1500,

    speed: 5

};


/* =====================================================
   CAMERA
===================================================== */

const camera = {

    x: player.x,

    y: player.y

};


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};

document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

    }
);

document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =====================================================
   BUILDINGS
===================================================== */

const buildings = [

    {

        id: "money",

        name: "MONEY BANK",

        icon: "💰",

        x: 650,

        y: 650,

        w: 280,

        h: 250,

        height: 170,

        color: "#1765ff"

    },

    {

        id: "time",

        name: "TIME CENTER",

        icon: "⏰",

        x: 1450,

        y: 650,

        w: 280,

        h: 250,

        height: 210,

        color: "#8b5cff"

    },

    {

        id: "team",

        name: "TEAM HQ",

        icon: "🤝",

        x: 650,

        y: 1800,

        w: 280,

        h: 250,

        height: 190,

        color: "#00bfa6"

    },

    {

        id: "mind",

        name: "MIND CENTER",

        icon: "🧠",

        x: 1450,

        y: 1800,

        w: 280,

        h: 250,

        height: 230,

        color: "#ff4fd8"

    }

];


/* =====================================================
   XP
===================================================== */

let xp = 0;

let level = 1;


function addXP(amount) {

    xp += amount;

    level =
        Math.floor(xp / 100) + 1;

    document.getElementById("xp")
        .textContent = xp;

    document.getElementById("level")
        .textContent = level;

}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;


function showMessage(text) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.opacity = "1";

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(
            () => {

                box.style.opacity = "0";

            },

            2500
        );

}


/* =====================================================
   3D PROJECTION
===================================================== */

function project(x, y, z) {

    const scale =
        500 /
        (500 + z);

    return {

        x:
        (x - camera.x) *
        scale +
        canvas.width / 2,

        y:
        (y - camera.y) *
        scale +
        canvas.height / 2 -
        z * 0.35,

        scale:
        scale

    };

}


/* =====================================================
   DRAW GROUND
===================================================== */

function drawGround() {

    const horizon =
        canvas.height * 0.42;


    const gradient =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#0a1230"
    );

    gradient.addColorStop(
        1,
        "#020510"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* futuristic grid */

    ctx.strokeStyle =
        "rgba(40,217,255,0.14)";

    ctx.lineWidth = 1;


    const gridSize = 100;


    for (
        let x = 0;
        x <= world.width;
        x += gridSize
    ) {

        const a =
            project(
                x,
                0,
                0
            );

        const b =
            project(
                x,
                world.height,
                0
            );

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y <= world.height;
        y += gridSize
    ) {

        const a =
            project(
                0,
                y,
                0
            );

        const b =
            project(
                world.width,
                y,
                0
            );

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

    }

}


/* =====================================================
   DRAW BUILDING
===================================================== */

function drawBuilding(building) {

    const bottom =
        project(
            building.x,
            building.y,
            0
        );

    const top =
        project(
            building.x,
            building.y,
            building.height
        );


    const width =
        building.w *
        bottom.scale;

    const height =
        building.h *
        bottom.scale;


    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,0.4)";

    ctx.beginPath();

    ctx.ellipse(
        bottom.x,
        bottom.y + 20,
        width * 0.65,
        20,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* front */

    ctx.fillStyle =
        building.color;

    ctx.globalAlpha = 0.85;

    ctx.fillRect(
        bottom.x - width / 2,
        top.y,
        width,
        height
    );


    /* roof */

    ctx.globalAlpha = 1;

    ctx.fillStyle =
        "#1a2750";

    ctx.beginPath();

    ctx.moveTo(
        top.x - width / 2,
        top.y
    );

    ctx.lineTo(
        top.x + width / 2,
        top.y
    );

    ctx.lineTo(
        top.x + width * 0.4,
        top.y - 35
    );

    ctx.lineTo(
        top.x - width * 0.4,
        top.y - 35
    );

    ctx.closePath();

    ctx.fill();


    /* glowing windows */

    ctx.fillStyle =
        "rgba(180,240,255,0.75)";


    const rows = 3;

    const columns = 4;


    for (
        let r = 0;
        r < rows;
        r++
    ) {

        for (
            let c = 0;
            c < columns;
            c++
        ) {

            const wx =
                bottom.x -
                width / 2 +
                35 +
                c * 48;

            const wy =
                top.y +
                35 +
                r * 50;

            ctx.fillRect(
                wx,
                wy,
                20,
                25
            );

        }

    }


    /* building name */

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 18px Arial";

    ctx.fillStyle =
        "white";

    ctx.shadowColor =
        building.color;

    ctx.shadowBlur = 15;

    ctx.fillText(
        building.icon +
        " " +
        building.name,

        bottom.x,

        top.y - 55
    );

    ctx.shadowBlur = 0;

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer() {

    const p =
        project(
            player.x,
            player.y,
            70
        );


    const size =
        45 *
        p.scale;


    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,0.5)";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y + 22,
        30 * p.scale,
        10 * p.scale,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle =
        "#2588ff";

    ctx.fillRect(
        p.x - size / 2,
        p.y,
        size,
        size
    );


    /* head */

    ctx.fillStyle =
        "#ffd2ad";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y - 15 * p.scale,
        16 * p.scale,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* glow */

    ctx.strokeStyle =
        "#29e1ff";

    ctx.lineWidth = 3;

    ctx.shadowColor =
        "#29e1ff";

    ctx.shadowBlur = 15;

    ctx.strokeRect(
        p.x - size / 2,
        p.y,
        size,
        size
    );

    ctx.shadowBlur = 0;

}


/* =====================================================
   MOVE PLAYER
===================================================== */

function updatePlayer() {

    let dx = 0;

    let dy = 0;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        dy -= player.speed;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        dy += player.speed;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        dx -= player.speed;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        dx += player.speed;

    }


    player.x += dx;

    player.y += dy;


    player.x =
        Math.max(
            100,
            Math.min(
                world.width - 100,
                player.x
            )
        );


    player.y =
        Math.max(
            100,
            Math.min(
                world.height - 100,
                player.y
            )
        );


    /* camera follows player */

    camera.x +=
        (player.x - camera.x)
        * 0.08;

    camera.y +=
        (player.y - camera.y)
        * 0.08;

}


/* =====================================================
   BUILDING DETECTION
===================================================== */

let nearbyBuilding = null;


function checkBuildings() {

    nearbyBuilding = null;


    for (
        const building
        of buildings
    ) {

        const dx =
            player.x -
            building.x;

        const dy =
            player.y -
            building.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance <
            250
        ) {

            nearbyBuilding =
                building;

            showMessage(
                "Press E to enter " +
                building.name
            );

            break;

        }

    }

}


/* =====================================================
   ENTER BUILDING
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase()
            === "e"
        ) {

            if (
                nearbyBuilding
            ) {

                openChallenge(
                    nearbyBuilding.id
                );

            }

        }

    }
);


/* =====================================================
   CHALLENGES
===================================================== */

const challenges = {

    money: {

        title:
        "💰 MONEY MISSION",

        question:
        "You receive ₹1,000. What is the smartest approach?",

        choices: [

            {

                text:
                "Spend everything immediately",

                xp: 5,

                result:
                "Fun is important, but spending everything leaves nothing for future needs."

            },

            {

                text:
                "Save some, spend responsibly and keep an emergency amount",

                xp: 30,

                result:
                "Excellent! Saving, planning and responsible spending are important financial skills."

            },

            {

                text:
                "Give away all the money",

                xp: 10,

                result:
                "Helping others is great, but you should also consider your own needs."

            }

        ]

    },


    time: {

        title:
        "⏰ TIME MISSION",

        question:
        "You have an important test tomorrow. Your friends invite you to play. What should you do?",

        choices: [

            {

                text:
                "Play all evening",

                xp: 5,

                result:
                "Fun matters, but ignoring an important responsibility can create problems."

            },

            {

                text:
                "Study first, then make time for recreation",

                xp: 30,

                result:
                "Great! Balance is an important part of time management."

            },

            {

                text:
                "Study continuously without any rest",

                xp: 10,

                result:
                "Breaks and recreation are also important for a healthy schedule."

            }

        ]

    },


    team: {

        title:
        "🤝 TEAMWORK MISSION",

        question:
        "Your team disagrees about how to complete a project. What should you do?",

        choices: [

            {

                text:
                "Tell everyone your idea is the only good one",

                xp: 5,

                result:
                "Good teamwork requires listening to different ideas."

            },

            {

                text:
                "Listen to everyone and find a shared solution",

                xp: 30,

                result:
                "Excellent! Listening and cooperation are powerful teamwork skills."

            },

            {

                text:
                "Leave the project to everyone else",

                xp: 5,

                result:
                "Team members need to contribute and communicate."

            }

        ]

    },


    mind: {

        title:
        "🧠 MINDSET MISSION",

        question:
        "You make a mistake while learning something new. What should you do?",

        choices: [

            {

                text:
                "Give up",

                xp: 5,

                result:
                "Mistakes are a normal part of learning."

            },

            {

                text:
                "Learn from the mistake and try again",

                xp: 30,

                result:
                "Excellent! Resilience means learning from mistakes and continuing forward."

            },

            {

                text:
                "Pretend the mistake never happened",

                xp: 5,

                result:
                "Recognizing mistakes can help you improve."

            }

        ]

    }

};


/* =====================================================
   OPEN CHALLENGE
===================================================== */

function openChallenge(type) {

    const challenge =
        challenges[type];


    document.getElementById(
        "modalTitle"
    ).textContent =
        challenge.title;


    document.getElementById(
        "question"
    ).textContent =
        challenge.question;


    const choices =
        document.getElementById(
            "choices"
        );


    choices.innerHTML = "";


    challenge.choices.forEach(
        function(choice) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "choice";


            button.textContent =
                choice.text;


            button.onclick =
                function() {

                    addXP(
                        choice.xp
                    );


                    document.getElementById(
                        "question"
                    ).textContent =
                        choice.result;


                    choices.innerHTML = `

                        <button
                            class="choice"
                            onclick="closeChallenge()">

                            Continue Learning 🚀

                        </button>

                    `;

                };


            choices.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


/* =====================================================
   CLOSE CHALLENGE
===================================================== */

function closeChallenge() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    updatePlayer();

    checkBuildings();

    drawGround();


    /* Sort buildings by distance */

    const sortedBuildings =
        [...buildings].sort(
            function(a,b) {

                return (
                    b.y - a.y
                );

            }
        );


    sortedBuildings.forEach(
        drawBuilding
    );


    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


/* =====================================================
   WELCOME
===================================================== */

setTimeout(
    function() {

        showMessage(
            "🌆 Welcome to SkillShareJR Life City!"
        );

    },
    700
);

</script>

</body>
</html>
